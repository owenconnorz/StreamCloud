name: Build StreamCloud Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    paths:
      - 'StreamCloud/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Release APK to GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: StreamCloud

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mobile
            assemble_task: assembleMobileRelease
            test_task: testMobileDebugUnitTest
          - flavor: tv
            assemble_task: assembleTvRelease
            test_task: ""
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (LFS disabled — libtorrserver.so extracted from release APK below)
        uses: actions/checkout@v5
        with:
          lfs: false

      # The libtorrserver.so binaries (~75 MB each × 4 arches) were previously tracked
      # via Git LFS, which burned through the LFS bandwidth quota every build.
      # Instead we extract them from the last known-good release APK (which lives on
      # GitHub Releases, not LFS).  The extracted files are cached so the 138 MB APK
      # download only happens on a cache miss.
      - name: Restore libtorrserver.so cache
        id: so-cache
        uses: actions/cache@v4
        with:
          path: StreamCloud/app/src/main/jniLibs
          key: libtorrserver-V1741

      - name: Extract libtorrserver.so from V1741 release APK
        if: steps.so-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading reference APK (V1741) to extract libtorrserver.so…"
          curl -fL             "https://github.com/owenconnorz/StreamCloud/releases/download/V1741/StreamCloud-release.apk"             -o /tmp/reference.apk
          echo "APK downloaded: $(stat -c%s /tmp/reference.apk) bytes"
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p app/src/main/jniLibs/$arch
            unzip -p /tmp/reference.apk "lib/$arch/libtorrserver.so"               > app/src/main/jniLibs/$arch/libtorrserver.so
            SIZE=$(stat -c%s app/src/main/jniLibs/$arch/libtorrserver.so)
            if [ "$SIZE" -lt 1000000 ]; then
              echo "::error::libtorrserver.so for $arch is suspiciously small ($SIZE bytes) — extraction may have failed"
              exit 1
            fi
            echo "  ✓ $arch: $SIZE bytes"
          done
          rm /tmp/reference.apk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (with caching + retry on transient CDN failures)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Required secrets (Settings → Secrets and variables → Actions):
      #   KEYSTORE_BASE64    – `base64 -w0 release.keystore`
      #   KEYSTORE_PASSWORD  – store password
      #   KEY_ALIAS          – key alias
      #   KEY_PASSWORD       – key password
      - name: Decode release keystore (best-effort, skip signing if it fails)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        continue-on-error: true
        run: |
          set +e
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/release.keystore" 2>/dev/null
          SIZE=$(stat -c%s "$RUNNER_TEMP/release.keystore" 2>/dev/null || echo 0)
          if [ "$SIZE" -gt 1000 ]; then
            echo "✅ Keystore decoded OK ($SIZE bytes)"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret is invalid or truncated ($SIZE bytes after decode). Release APK will be UNSIGNED."
            rm -f "$RUNNER_TEMP/release.keystore"
          fi
          exit 0

      - name: Build mobile release APK + unit tests
        if: matrix.flavor == 'mobile'
        run: >-
          ./gradlew ${{ matrix.assemble_task }} ${{ matrix.test_task }}
          --tests 'com.streamcloud.app.data.api.PornhubRepositoryTest'
          --tests 'com.streamcloud.app.ui.viewmodel.TmdbSearchPaginationTest'
          --tests 'com.streamcloud.app.ui.components.MovieArtworkTest'
          --tests 'com.streamcloud.app.ui.screens.MovieDetailDownloadGuardTest'
          --tests 'com.streamcloud.app.ads.AdPolicyTest'
          --tests 'com.streamcloud.app.data.nuvio.NuvioAddonSyncTest'
          --tests 'com.streamcloud.app.player.WatchProgressRestorePolicyTest'
          --no-daemon --stacktrace --no-build-cache

      - name: Build TV release APK
        if: matrix.flavor == 'tv'
        run: >-
          ./gradlew ${{ matrix.assemble_task }}
          --no-daemon --stacktrace --no-build-cache

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          cp "app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk" \
            "artifacts/StreamCloud-${{ matrix.flavor }}-release.apk"
          ls -la artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamCloud-${{ matrix.flavor }}-apk
          path: StreamCloud/artifacts/*.apk
          retention-days: 30

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: StreamCloud-*-apk
          path: StreamCloud/artifacts
          merge-multiple: true

      - name: Normalize release APK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for flavor in mobile tv; do
            target="artifacts/StreamCloud-${flavor}-release.apk"
            source="$(find artifacts -type f -name "StreamCloud-${flavor}-release.apk" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "::error::Missing APK for ${flavor}"
              find artifacts -maxdepth 4 -type f -print
              exit 1
            fi
            if [[ "$source" != "$target" ]]; then
              cp "$source" "$target"
            fi
            test -s "$target"
            echo "Ready: $target ($(stat -c%s "$target") bytes)"
          done

      - name: Publish StreamCloud GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ github.run_number }}
          name: StreamCloud V${{ github.run_number }}
          body_path: StreamCloud/CHANGELOG.md
          files: |
            StreamCloud/artifacts/StreamCloud-mobile-release.apk
            StreamCloud/artifacts/StreamCloud-tv-release.apk
          fail_on_unmatched_files: true
